apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "microservice.name" . }}
spec:
  schedule: {{ .Values.schedule | default "*/15 * * * *" | quote }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit | default 1 }}
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds | default 120 }}
  jobTemplate:
    spec:
      {{- with .Values.activeDeadlineSeconds }}
      # Caps a run below the schedule interval. Without this, a stalled
      # fetch pushes the run past 15 min and concurrencyPolicy: Forbid
      # silently skips every subsequent tick.
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      backoffLimit: {{ .Values.backoffLimit | default 2 }}
      {{- with .Values.ttlSecondsAfterFinished }}
      ttlSecondsAfterFinished: {{ . }}
      {{- end }}
      template:
        spec:
          nodeSelector:
            {{- toYaml (.Values.nodeSelector | default (dict "kubernetes.io/os" "linux")) | nindent 12 }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ include "microservice.name" . }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
              env:
                - name: ARANGO_USER
                  valueFrom:
                    secretKeyRef:
                      name: arangodb
                      key: DBUserName
                - name: ARANGO_PASS
                  valueFrom:
                    secretKeyRef:
                      name: arangodb
                      key: DBPassword
                - name: ARANGO_HOST
                  valueFrom:
                    secretKeyRef:
                      name: arangodb
                      key: DBHost
                - name: ARANGO_PORT
                  valueFrom:
                    secretKeyRef:
                      name: arangodb
                      key: DBPort
                # --- Non-secret config: shared values from .Values.global ---
                - name: API_BASE_URL
                  value: "{{ .Values.global.apiBaseUrl }}"
                - name: BASE_URL
                  value: "{{ .Values.global.baseUrl }}"
                - name: GITHUB_APP_NAME
                  value: "{{ .Values.global.github.appName }}"
                - name: GITHUB_APP_ID
                  value: "{{ .Values.global.github.appId }}"
                - name: GITHUB_CLIENT_ID
                  value: "{{ .Values.global.github.clientId }}"
                # --- True secrets: pulled from Secret objects ---
                - name: GITHUB_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: github-creds
                      key: ClientSecret
                - name: GITHUB_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: github-creds
                      key: PrivateKey
                - name: GITHUB_READONLY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: github-creds
                      key: ReadOnlyToken
                - name: TOKEN_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: token-encryption
                      key: TokenEncryptionKey
                {{- with .Values.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- with .Values.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          restartPolicy: {{ .Values.restartPolicy | default "OnFailure" }}
